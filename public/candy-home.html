<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A candy house — interactive illustration for WellRoost</title>
  <style>
    /*
      Framed illustration for wellroost.com.

      The page around this frame is paper and ink, so the frame itself carries no chrome: no header,
      no badges, no glass. Only two small chips, in the page's own palette. The ground is transparent
      so the paper shows through, and night mode paints a dark field inside the frame — the plate
      going dark is the effect, not the page.
    */
    :root {
      --ui-text: #14130e;
      --ui-chip: rgba(251, 250, 246, 0.92);
      --ui-line: rgba(20, 19, 14, 0.14);
      --night-top: #101a15;
      --night-bot: #1c3b2e;
    }

    body.night-mode {
      --ui-text: #ebe9e3;
      --ui-chip: rgba(20, 32, 26, 0.78);
      --ui-line: rgba(235, 233, 227, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Geist Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: transparent;
      transition: background 0.8s ease;
    }

    body.night-mode {
      background: linear-gradient(180deg, var(--night-top) 0%, var(--night-bot) 100%);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    .scene-controls {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .chip {
      background: var(--ui-chip);
      border: 1px solid var(--ui-line);
      color: var(--ui-text);
      padding: 8px 15px;
      border-radius: 999px;
      font: inherit;
      font-weight: 500;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.3s ease, color 0.3s ease;
    }

    .chip:hover { transform: translateY(-1px); }
    .chip:active { transform: translateY(0) scale(0.98); }
    .chip:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  </style>
  <!-- three.js r128, vendored locally: no third-party runtime on a production page. -->
  <script src="/vendor/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="scene-controls">
    <button id="btn-mood" class="chip" type="button">Night</button>
    <button id="btn-audio" class="chip" type="button" aria-pressed="false">Sound off</button>
  </div>

  <script>
    // ============================================================================
    // 1. CONFIGURATION & STATE
    // ============================================================================
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const STATE = {
      heartMode: false,
      doorOpen: false,
      doorAngle: 0,
      isCharging: false,
      batteryLevel: 0.65,
      nightMode: false,
      // Audio starts off: a page should never make noise because a visitor scrolled past it.
      sfxEnabled: false,
      hoveredGroup: null,
      autoRotateSpeed: prefersReducedMotion ? 0.04 : 0.16,
      particleSpeedScale: prefersReducedMotion ? 0.55 : 1.0
    };

    // ============================================================================
    // 2. PROCEDURAL WEB AUDIO SYNTHESIZER (No external audio files)
    // ============================================================================
    class CandyAudio {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playDoorSound(opening) {
        if (!STATE.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';

        osc.frequency.setValueAtTime(opening ? 240 : 380, now);
        osc.frequency.exponentialRampToValueAtTime(opening ? 480 : 210, now + 0.26);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      }

      playChimneyPop(toHearts) {
        if (!STATE.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = toHearts ? [523.25, 659.25, 783.99] : [440, 349.23];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);

          gain.gain.setValueAtTime(0.001, now + idx * 0.06);
          gain.gain.linearRampToValueAtTime(0.1, now + idx * 0.06 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.22);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.24);
        });
      }

      playChargeToggle(starting) {
        if (!STATE.sfxEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';

        osc.frequency.setValueAtTime(starting ? 320 : 620, now);
        osc.frequency.exponentialRampToValueAtTime(starting ? 740 : 260, now + 0.35);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.11, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const sfx = new CandyAudio();

    // ============================================================================
    // 3. PROCEDURAL CANVAS TEXTURES
    // ============================================================================
    function createPeppermintTexture(repeatX = 4, repeatY = 4, diagonal = true) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#fff9fb';
      ctx.fillRect(0, 0, 256, 256);

      ctx.fillStyle = '#ff477e';
      for (let i = -256; i < 512; i += 64) {
        ctx.beginPath();
        if (diagonal) {
          ctx.moveTo(i, 0);
          ctx.lineTo(i + 32, 0);
          ctx.lineTo(i - 224, 256);
          ctx.lineTo(i - 256, 256);
        } else {
          ctx.rect(i, 0, 32, 256);
        }
        ctx.closePath();
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      return tex;
    }

    function createRoofWaffleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ff85a7';
      ctx.fillRect(0, 0, 256, 256);

      const colors = ['#ffffff', '#ffe066', '#72efdd', '#ff477e'];
      for (let i = 0; i < 90; i++) {
        ctx.fillStyle = colors[i % colors.length];
        const x = (i * 73) % 240 + 8;
        const y = (i * 41) % 240 + 8;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((i * 1.1) % Math.PI);
        ctx.fillRect(-6, -2.5, 12, 5);
        ctx.restore();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      return tex;
    }

    function createParticleSprites() {
      const smokeCanvas = document.createElement('canvas');
      smokeCanvas.width = 128;
      smokeCanvas.height = 128;
      const sCtx = smokeCanvas.getContext('2d');

      const grad = sCtx.createRadialGradient(64, 64, 8, 64, 64, 58);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.55, 'rgba(255, 248, 252, 0.8)');
      grad.addColorStop(1, 'rgba(255, 240, 248, 0.0)');
      sCtx.fillStyle = grad;
      sCtx.beginPath();
      sCtx.arc(64, 64, 60, 0, Math.PI * 2);
      sCtx.fill();

      const heartCanvas = document.createElement('canvas');
      heartCanvas.width = 128;
      heartCanvas.height = 128;
      const hCtx = heartCanvas.getContext('2d');

      hCtx.save();
      hCtx.translate(64, 68);
      hCtx.beginPath();
      hCtx.moveTo(0, 36);
      hCtx.bezierCurveTo(-52, 2, -56, -42, -25, -46);
      hCtx.bezierCurveTo(-6, -48, 0, -28, 0, -22);
      hCtx.bezierCurveTo(0, -28, 6, -48, 25, -46);
      hCtx.bezierCurveTo(56, -42, 52, 2, 0, 36);
      hCtx.closePath();

      const hGrad = hCtx.createLinearGradient(-40, -45, 40, 38);
      hGrad.addColorStop(0, '#ff4d79');
      hGrad.addColorStop(1, '#ff1e56');
      hCtx.fillStyle = hGrad;
      hCtx.fill();

      hCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      hCtx.beginPath();
      hCtx.ellipse(-18, -26, 8, 5, -0.5, 0, Math.PI * 2);
      hCtx.fill();
      hCtx.restore();

      return {
        smokeTex: new THREE.CanvasTexture(smokeCanvas),
        heartTex: new THREE.CanvasTexture(heartCanvas)
      };
    }

    function createBatteryTexture(level, isCharging) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 256, 128);

      ctx.fillStyle = 'rgba(24, 34, 48, 0.88)';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      roundRect(ctx, 18, 24, 204, 80, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      roundRect(ctx, 226, 46, 14, 36, 6);
      ctx.fill();

      const fillW = Math.max(12, Math.floor(176 * level));
      const grad = ctx.createLinearGradient(32, 0, 208, 0);
      grad.addColorStop(0, '#00f5b8');
      grad.addColorStop(1, '#00bbf9');
      ctx.fillStyle = grad;
      roundRect(ctx, 32, 38, fillW, 52, 12);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const pct = Math.round(level * 100);
      ctx.fillText((isCharging ? '⚡ ' : '') + pct + '%', 120, 65);

      return new THREE.CanvasTexture(canvas);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ============================================================================
    // 4. SCENE, CAMERA & LIGHTING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    // Fog matched to the page's paper ground so the island recedes into the page, not into a haze.
    const FOG_DAY = 0xebe9e3;
    scene.fog = new THREE.FogExp2(FOG_DAY, 0.0062);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xfff5f9, 0xcfe6d6, 0.5);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff2dd, 0.85);
    dirLight.position.set(14, 22, 16);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 55;
    const d = 14;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0xffb3c6, 0.35);
    rimLight.position.set(-14, 10, -12);
    scene.add(rimLight);

    const worldRoot = new THREE.Group();
    scene.add(worldRoot);

    const MATS = {
      gingerbread: new THREE.MeshStandardMaterial({ color: 0xc97b4b, roughness: 0.75, metalness: 0.02 }),
      pastelWall: new THREE.MeshStandardMaterial({ color: 0xf6a8bb, roughness: 0.65, metalness: 0.02 }),
      icing: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.05 }),
      roofSprinkle: new THREE.MeshStandardMaterial({ map: createRoofWaffleTexture(), roughness: 0.5 }),
      peppermint: new THREE.MeshStandardMaterial({ map: createPeppermintTexture(2, 2, true), roughness: 0.35 }),
      chocolate: new THREE.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.55 }),
      windowGlow: new THREE.MeshStandardMaterial({
        color: 0xfff3b0,
        emissive: 0xffbe0b,
        emissiveIntensity: 0.65,
        roughness: 0.2
      }),
      interiorGlow: new THREE.MeshStandardMaterial({
        color: 0xffd166,
        emissive: 0xff9f1c,
        emissiveIntensity: 0.35,
        roughness: 0.4
      }),
      carBody: new THREE.MeshStandardMaterial({ color: 0x80ed99, roughness: 0.3, metalness: 0.08 }),
      carCabin: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 }),
      carGlass: new THREE.MeshStandardMaterial({ color: 0xa9def9, roughness: 0.15, metalness: 0.2 }),
      tire: new THREE.MeshStandardMaterial({ color: 0x3b373b, roughness: 0.8 }),
      rim: new THREE.MeshStandardMaterial({ color: 0xfff0f5, roughness: 0.3 }),
      cableMat: new THREE.MeshStandardMaterial({
        color: 0x2ec4b6,
        emissive: 0x00f5d4,
        emissiveIntensity: 0.05,
        roughness: 0.35
      }),
      portMat: new THREE.MeshStandardMaterial({
        color: 0x4cc9f0,
        emissive: 0x00f5d4,
        emissiveIntensity: 0.15,
        roughness: 0.2
      })
    };

    const interactables = [];

    function registerInteractable(group, name) {
      group.userData.interactiveName = name;
      group.userData.baseScale = group.scale.clone();
      group.userData.targetScale = 1.0;
      group.userData.currentScale = 1.0;
      interactables.push(group);
    }

    // ============================================================================
    // 5. GROUND, PATHWAY & CANDY LANDSCAPE
    // ============================================================================
    function buildEnvironment() {
      const envGroup = new THREE.Group();

      const cookieBase = new THREE.Mesh(
        new THREE.CylinderGeometry(11.6, 12.0, 0.9, 64),
        MATS.gingerbread
      );
      cookieBase.position.y = -0.55;
      cookieBase.receiveShadow = true;
      envGroup.add(cookieBase);

      const frostedLawn = new THREE.Mesh(
        new THREE.CylinderGeometry(11.3, 11.5, 0.35, 64),
        new THREE.MeshStandardMaterial({ color: 0xbfe3c8, roughness: 0.65 })
      );
      frostedLawn.position.y = -0.12;
      frostedLawn.receiveShadow = true;
      envGroup.add(frostedLawn);

      const dollopGeo = new THREE.SphereGeometry(0.45, 16, 16);
      const numDollops = 40;
      for (let i = 0; i < numDollops; i++) {
        const angle = (i / numDollops) * Math.PI * 2;
        const dollop = new THREE.Mesh(dollopGeo, MATS.icing);
        dollop.position.set(Math.cos(angle) * 11.25, -0.08, Math.sin(angle) * 11.25);
        dollop.scale.set(1.1, 0.75, 1.1);
        dollop.receiveShadow = true;
        envGroup.add(dollop);
      }

      const stoneGeo = new THREE.CylinderGeometry(0.58, 0.65, 0.12, 20);
      const stoneColors = [0xffb5a7, 0xfcd5ce, 0xf9dcc4, 0xfec89a];
      for (let i = 0; i < 5; i++) {
        const stone = new THREE.Mesh(
          stoneGeo,
          new THREE.MeshStandardMaterial({ color: stoneColors[i % stoneColors.length], roughness: 0.5 })
        );
        stone.position.set(-1.2 + Math.sin(i * 0.8) * 0.28, 0.04, 2.3 + i * 1.15);
        stone.scale.set(1.2, 1, 0.85);
        stone.receiveShadow = true;
        stone.castShadow = true;
        envGroup.add(stone);
      }

      const driveway = new THREE.Mesh(
        new THREE.CylinderGeometry(3.2, 3.3, 0.08, 32),
        new THREE.MeshStandardMaterial({ color: 0xfbf8cc, roughness: 0.7 })
      );
      driveway.position.set(3.5, 0.03, 2.4);
      driveway.scale.set(1.15, 1, 1.35);
      driveway.receiveShadow = true;
      envGroup.add(driveway);

      const treeConfigs = [
        { x: -6.4, z: -3.2, scale: 1.25, color: 0xff8fba },
        { x: -7.2, z: 2.2, scale: 0.95, color: 0x9cc8f2 },
        { x: 6.8, z: -3.8, scale: 1.15, color: 0xffa6c8 },
        { x: 2.2, z: -6.2, scale: 1.05, color: 0xa8dd9d }
      ];

      const trunkGeo = new THREE.CylinderGeometry(0.18, 0.26, 1.6, 12);
      const puffGeo = new THREE.SphereGeometry(1.0, 24, 24);

      treeConfigs.forEach((cfg) => {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(trunkGeo, MATS.gingerbread);
        trunk.position.y = 0.8;
        trunk.castShadow = true;
        tree.add(trunk);

        const puffMat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.45 });
        const mainPuff = new THREE.Mesh(puffGeo, puffMat);
        mainPuff.position.y = 2.0;
        mainPuff.castShadow = true;
        tree.add(mainPuff);

        const sidePuff1 = new THREE.Mesh(puffGeo, puffMat);
        sidePuff1.scale.setScalar(0.68);
        sidePuff1.position.set(0.65, 1.65, 0.3);
        sidePuff1.castShadow = true;
        tree.add(sidePuff1);

        const sidePuff2 = new THREE.Mesh(puffGeo, puffMat);
        sidePuff2.scale.setScalar(0.62);
        sidePuff2.position.set(-0.6, 1.75, -0.35);
        sidePuff2.castShadow = true;
        tree.add(sidePuff2);

        tree.position.set(cfg.x, 0, cfg.z);
        tree.scale.setScalar(cfg.scale);
        envGroup.add(tree);
      });

      const lolliCoords = [
        { x: -4.2, z: 4.5, rot: 0.2 },
        { x: 6.4, z: 4.8, rot: -0.35 },
        { x: -3.2, z: -5.4, rot: 0.1 }
      ];
      lolliCoords.forEach((lc) => {
        const lolli = createLollipopMesh();
        lolli.position.set(lc.x, 0, lc.z);
        lolli.rotation.y = lc.rot;
        lolli.rotation.z = 0.08;
        envGroup.add(lolli);
      });

      worldRoot.add(envGroup);
    }

    function createLollipopMesh() {
      const group = new THREE.Group();
      const stick = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.06, 1.5, 12),
        MATS.icing
      );
      stick.position.y = 0.75;
      stick.castShadow = true;
      group.add(stick);

      const candy = new THREE.Mesh(
        new THREE.CylinderGeometry(0.55, 0.55, 0.22, 28),
        MATS.peppermint
      );
      candy.rotation.x = Math.PI / 2;
      candy.position.y = 1.55;
      candy.castShadow = true;
      group.add(candy);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.08, 12, 28),
        MATS.icing
      );
      rim.position.y = 1.55;
      rim.castShadow = true;
      group.add(rim);

      return group;
    }

    // ============================================================================
    // 6. CANDY HOUSE, CHIMNEY & INTERACTIVE DOOR
    // ============================================================================
    let doorHingePivot = null;
    let interiorPointLight = null;
    const chimneySpawnPos = new THREE.Vector3();

    function buildCandyHouse() {
      const houseGroup = new THREE.Group();
      houseGroup.position.set(-1.2, 0, -0.6);

      const wallW = 4.4;
      const wallH = 2.7;
      const wallD = 3.6;

      const walls = new THREE.Mesh(
        new THREE.BoxGeometry(wallW, wallH, wallD),
        MATS.pastelWall
      );
      walls.position.y = wallH / 2;
      walls.castShadow = true;
      walls.receiveShadow = true;
      houseGroup.add(walls);

      const pillarGeo = new THREE.CylinderGeometry(0.24, 0.26, wallH + 0.05, 16);
      const corners = [
        [-wallW / 2, -wallD / 2],
        [wallW / 2, -wallD / 2],
        [-wallW / 2, wallD / 2],
        [wallW / 2, wallD / 2]
      ];
      corners.forEach(([cx, cz]) => {
        const pillar = new THREE.Mesh(pillarGeo, MATS.gingerbread);
        pillar.position.set(cx, wallH / 2, cz);
        pillar.castShadow = true;
        houseGroup.add(pillar);
      });

      const alcove = new THREE.Mesh(
        new THREE.BoxGeometry(1.15, 1.65, 0.4),
        MATS.interiorGlow
      );
      alcove.position.set(0, 0.85, wallD / 2 - 0.15);
      houseGroup.add(alcove);

      interiorPointLight = new THREE.PointLight(0xffaa33, 0.0, 5.5);
      interiorPointLight.position.set(0, 1.1, wallD / 2 + 0.55);
      houseGroup.add(interiorPointLight);

      const doorInteractiveGroup = new THREE.Group();
      doorInteractiveGroup.position.set(0, 0, wallD / 2 + 0.02);

      const archFrame = new THREE.Mesh(
        new THREE.TorusGeometry(0.68, 0.11, 14, 28, Math.PI),
        MATS.peppermint
      );
      archFrame.position.set(0, 1.15, 0.02);
      archFrame.castShadow = true;
      doorInteractiveGroup.add(archFrame);

      const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 1.15, 14), MATS.peppermint);
      leftPost.position.set(-0.68, 0.575, 0.02);
      leftPost.castShadow = true;
      doorInteractiveGroup.add(leftPost);

      const rightPost = leftPost.clone();
      rightPost.position.x = 0.68;
      doorInteractiveGroup.add(rightPost);

      doorHingePivot = new THREE.Group();
      doorHingePivot.position.set(-0.52, 0, 0.02);

      const doorSlab = new THREE.Mesh(
        new THREE.BoxGeometry(1.04, 1.55, 0.12),
        MATS.chocolate
      );

    // ============================================================================
    // 8. POOLED PARTICLE SYSTEM (Soft Smoke <-> Floating Red Hearts)
    // ============================================================================
    const PARTICLE_COUNT = 28;
    const particles = [];
    const particleSprites = createParticleSprites();

    function initParticlePool() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const mat = new THREE.SpriteMaterial({
          map: particleSprites.smokeTex,
          transparent: true,
          opacity: 0,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        scene.add(sprite);

        particles.push({
          sprite,
          age: (i / PARTICLE_COUNT) * 4.2,
          life: 4.2,
          isHeart: false,
          seed: Math.random() * Math.PI * 2,
          driftX: (Math.random() - 0.5) * 0.35,
          driftZ: (Math.random() - 0.5) * 0.35
        });

        resetParticle(particles[i], true);
      }
    }

    function resetParticle(p, initial = false) {
      p.isHeart = STATE.heartMode;
      p.sprite.material.map = p.isHeart ? particleSprites.heartTex : particleSprites.smokeTex;
      p.sprite.material.needsUpdate = true;

      if (!initial) {
        p.age = 0;
      }
      p.seed = Math.random() * Math.PI * 2;
      p.driftX = (Math.random() - 0.5) * 0.35;
      p.driftZ = (Math.random() - 0.5) * 0.35;
    }

    function updateParticles(dt, elapsed) {
      const speed = STATE.particleSpeedScale;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        p.age += dt * speed;

        if (p.age >= p.life) {
          resetParticle(p, false);
        }

        const t = p.age / p.life;

        const riseHeight = t * 4.4;
        const swayX = Math.sin(elapsed * 1.8 + p.seed + t * 4.0) * (p.isHeart ? 0.32 : 0.22) * t;
        const swayZ = Math.cos(elapsed * 1.5 + p.seed) * 0.18 * t;

        p.sprite.position.set(
          chimneySpawnPos.x + p.driftX * t + swayX,
          chimneySpawnPos.y + riseHeight,
          chimneySpawnPos.z + p.driftZ * t + swayZ
        );

        let scale;
        if (p.isHeart) {
          scale = 0.25 + Math.sin(t * Math.PI) * 0.55;
          p.sprite.material.rotation = Math.sin(elapsed * 2.4 + p.seed) * 0.35;
        } else {
          scale = 0.35 + t * 1.15;
          p.sprite.material.rotation = elapsed * 0.4 + p.seed;
        }
        p.sprite.scale.set(scale, scale, 1);

        const fadeIn = Math.min(1, t * 4.5);
        const fadeOut = Math.max(0, 1 - Math.pow(t, 1.6));
        p.sprite.material.opacity = fadeIn * fadeOut * (p.isHeart ? 0.95 : 0.72);
      }
    }

    // ============================================================================
    // 9. CUSTOM DAMPED ORBIT & ZOOM CONTROLS (Desktop Mouse + Mobile Touch)
    // ============================================================================
    // The frame is wide on desktop and tall on a phone. A fixed radius framed the desktop well and
    // pushed the island out of a phone's narrow horizontal field, so the distance is derived from
    // the frame's aspect instead.
    function fitRadius() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      if (aspect < 1.05) return 31;
      if (aspect < 1.6) return 26.5;
      return 22.8;
    }

    const CAM_CTRL = {
      target: new THREE.Vector3(0.7, 1.15, 0.2),
      theta: 0.42,
      phi: 1.09,
      radius: fitRadius(),
      targetTheta: 0.42,
      targetPhi: 1.09,
      targetRadius: fitRadius(),
      minPhi: 0.45,
      maxPhi: 1.44,
      minRadius: 9.5,
      maxRadius: 34.0,
      isDragging: false,
      pointerDownPos: { x: 0, y: 0 },
      lastPointerPos: { x: 0, y: 0 },
      lastPinchDist: 0,
      lastInteractionTime: -10
    };

    function setupControlsAndInteractions() {
      const dom = renderer.domElement;
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      function getIntersects(clientX, clientY) {
        const rect = dom.getBoundingClientRect();
        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);

        const hits = raycaster.intersectObjects(interactables, true);
        if (hits.length > 0) {
          let obj = hits[0].object;
          while (obj && !obj.userData.interactiveName) {
            obj = obj.parent;
          }
          return obj;
        }
        return null;
      }

      dom.addEventListener('mousedown', (e) => {
        CAM_CTRL.isDragging = true;
        CAM_CTRL.pointerDownPos = { x: e.clientX, y: e.clientY };
        CAM_CTRL.lastPointerPos = { x: e.clientX, y: e.clientY };
        CAM_CTRL.lastInteractionTime = performance.now() * 0.001;
      });

      window.addEventListener('mousemove', (e) => {
        if (CAM_CTRL.isDragging) {
          const dx = e.clientX - CAM_CTRL.lastPointerPos.x;
          const dy = e.clientY - CAM_CTRL.lastPointerPos.y;
          CAM_CTRL.targetTheta -= dx * 0.0065;
          CAM_CTRL.targetPhi = Math.max(
            CAM_CTRL.minPhi,
            Math.min(CAM_CTRL.maxPhi, CAM_CTRL.targetPhi - dy * 0.0055)
          );
          CAM_CTRL.lastPointerPos = { x: e.clientX, y: e.clientY };
          CAM_CTRL.lastInteractionTime = performance.now() * 0.001;
          return;
        }

        const hovered = getIntersects(e.clientX, e.clientY);
        if (hovered !== STATE.hoveredGroup) {
          if (STATE.hoveredGroup) STATE.hoveredGroup.userData.targetScale = 1.0;
          STATE.hoveredGroup = hovered;
          if (STATE.hoveredGroup) STATE.hoveredGroup.userData.targetScale = 1.07;
          dom.style.cursor = STATE.hoveredGroup ? 'pointer' : 'grab';
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (!CAM_CTRL.isDragging) return;
        CAM_CTRL.isDragging = false;

        const moveDist = Math.hypot(
          e.clientX - CAM_CTRL.pointerDownPos.x,
          e.clientY - CAM_CTRL.pointerDownPos.y
        );
        if (moveDist < 6) {
          const clickedGroup = getIntersects(e.clientX, e.clientY);
          if (clickedGroup) triggerInteraction(clickedGroup);
        }
      });

      dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        CAM_CTRL.targetRadius = Math.max(
          CAM_CTRL.minRadius,
          Math.min(CAM_CTRL.maxRadius, CAM_CTRL.targetRadius + e.deltaY * 0.01)
        );
        CAM_CTRL.lastInteractionTime = performance.now() * 0.001;
      }, { passive: false });

      dom.addEventListener('touchstart', (e) => {
        CAM_CTRL.lastInteractionTime = performance.now() * 0.001;
        if (e.touches.length === 1) {
          CAM_CTRL.isDragging = true;
          const t = e.touches[0];
          CAM_CTRL.pointerDownPos = { x: t.clientX, y: t.clientY };
          CAM_CTRL.lastPointerPos = { x: t.clientX, y: t.clientY };
        } else if (e.touches.length === 2) {
          CAM_CTRL.isDragging = false;
          CAM_CTRL.lastPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      dom.addEventListener('touchmove', (e) => {
        CAM_CTRL.lastInteractionTime = performance.now() * 0.001;
        if (e.touches.length === 1 && CAM_CTRL.isDragging) {
          const t = e.touches[0];
          const dx = t.clientX - CAM_CTRL.lastPointerPos.x;
          const dy = t.clientY - CAM_CTRL.lastPointerPos.y;
          CAM_CTRL.targetTheta -= dx * 0.007;
          CAM_CTRL.targetPhi = Math.max(
            CAM_CTRL.minPhi,
            Math.min(CAM_CTRL.maxPhi, CAM_CTRL.targetPhi - dy * 0.006)
          );
          CAM_CTRL.lastPointerPos = { x: t.clientX, y: t.clientY };
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = CAM_CTRL.lastPinchDist - dist;
          CAM_CTRL.targetRadius = Math.max(
            CAM_CTRL.minRadius,
            Math.min(CAM_CTRL.maxRadius, CAM_CTRL.targetRadius + delta * 0.03)
          );
          CAM_CTRL.lastPinchDist = dist;
        }
      }, { passive: true });

      dom.addEventListener('touchend', (e) => {
        if (CAM_CTRL.isDragging && e.changedTouches.length === 1) {
          const t = e.changedTouches[0];
          const moveDist = Math.hypot(
            t.clientX - CAM_CTRL.pointerDownPos.x,
            t.clientY - CAM_CTRL.pointerDownPos.y
          );
          if (moveDist < 12) {
            const tappedGroup = getIntersects(t.clientX, t.clientY);
            if (tappedGroup) triggerInteraction(tappedGroup);
          }
        }
        CAM_CTRL.isDragging = false;
      });
    }

    // ============================================================================
    // 10. INTERACTION HANDLERS
    // ============================================================================
    function triggerInteraction(group) {
      const name = group.userData.interactiveName;

      group.userData.currentScale = 1.15;

      if (name === 'chimney') {
        STATE.heartMode = !STATE.heartMode;
        sfx.playChimneyPop(STATE.heartMode);

        particles.forEach((p, idx) => {
          if (idx % 2 === 0 && p.age < 1.5) {
            p.isHeart = STATE.heartMode;
            p.sprite.material.map = p.isHeart ? particleSprites.heartTex : particleSprites.smokeTex;
            p.sprite.material.needsUpdate = true;
          }
        });
      }

      else if (name === 'door') {
        STATE.doorOpen = !STATE.doorOpen;
        sfx.playDoorSound(STATE.doorOpen);
      }

      else if (name === 'car') {
        STATE.isCharging = !STATE.isCharging;
        sfx.playChargeToggle(STATE.isCharging);
        cablePulses.forEach((p) => (p.visible = STATE.isCharging));
      }
    }

      audioBtn.textContent = STATE.sfxEnabled ? 'Sound on' : 'Sound off';
      audioBtn.setAttribute('aria-pressed', STATE.sfxEnabled ? 'true' : 'false');
      if (STATE.sfxEnabled) sfx.init();
    });

    // ============================================================================
    // 11. ANIMATION LOOP — pauses when the frame is offscreen or the tab is hidden
    // ============================================================================
    const clock = new THREE.Clock();
    let running = true;

    function setRunning(next) {
      running = next;
      // Reset the clock delta after a pause so the scene does not jump forward.
      clock.getDelta();
    }

    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(
        ([entry]) => setRunning(entry.isIntersecting),
        { threshold: 0.02 }
      );
      io.observe(document.body);
    }
    document.addEventListener('visibilitychange', () => setRunning(!document.hidden));

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      if (!running) return;

      const timeSinceInteract = performance.now() * 0.001 - CAM_CTRL.lastInteractionTime;
      if (!CAM_CTRL.isDragging && timeSinceInteract > 3.5) {
        CAM_CTRL.targetTheta += STATE.autoRotateSpeed * dt;
      }

      const damp = 1 - Math.exp(-8 * dt);
      CAM_CTRL.theta += (CAM_CTRL.targetTheta - CAM_CTRL.theta) * damp;
      CAM_CTRL.phi += (CAM_CTRL.targetPhi - CAM_CTRL.phi) * damp;
      CAM_CTRL.radius += (CAM_CTRL.targetRadius - CAM_CTRL.radius) * damp;

      camera.position.x = CAM_CTRL.target.x + CAM_CTRL.radius * Math.sin(CAM_CTRL.phi) * Math.sin(CAM_CTRL.theta);
      camera.position.y = CAM_CTRL.target.y + CAM_CTRL.radius * Math.cos(CAM_CTRL.phi);
      camera.position.z = CAM_CTRL.target.z + CAM_CTRL.radius * Math.sin(CAM_CTRL.phi) * Math.cos(CAM_CTRL.theta);
      camera.lookAt(CAM_CTRL.target);

      interactables.forEach((group) => {
        group.userData.currentScale += (group.userData.targetScale - group.userData.currentScale) * (1 - Math.exp(-14 * dt));
        const s = group.userData.currentScale;
        group.scale.set(
          group.userData.baseScale.x * s,
          group.userData.baseScale.y * s,
          group.userData.baseScale.z * s
        );
      });

      const targetDoorAngle = STATE.doorOpen ? -Math.PI * 0.62 : 0;
      STATE.doorAngle += (targetDoorAngle - STATE.doorAngle) * (1 - Math.exp(-7 * dt));
      if (doorHingePivot) {
        doorHingePivot.rotation.y = STATE.doorAngle;
      }
      if (interiorPointLight) {
        const openRatio = Math.abs(STATE.doorAngle) / (Math.PI * 0.62);
        interiorPointLight.intensity = openRatio * (STATE.nightMode ? 2.4 : 1.4);
        MATS.interiorGlow.emissiveIntensity = 0.25 + openRatio * 1.1;
      }

      if (STATE.isCharging) {
        STATE.batteryLevel += dt * 0.045;
        if (STATE.batteryLevel > 1.0) STATE.batteryLevel = 0.25;

        const pulseGlow = 0.55 + 0.35 * Math.sin(elapsed * 6.0);
        MATS.cableMat.emissiveIntensity = STATE.nightMode ? pulseGlow * 1.6 : pulseGlow;
        MATS.portMat.emissiveIntensity = 1.2 + 0.5 * Math.sin(elapsed * 8.0);
        chargePortLight.intensity = STATE.nightMode ? 1.8 : 0.9;

        cablePulses.forEach((pulse) => {
          const u = (elapsed * 0.65 + pulse.userData.offset) % 1.0;
          const pos = cableCurve.getPointAt(u);
          pulse.position.copy(pos);
          const s = 0.8 + Math.sin(u * Math.PI) * 0.6;
          pulse.scale.setScalar(s);
        });
      } else {
        MATS.cableMat.emissiveIntensity = 0.05;
        MATS.portMat.emissiveIntensity = 0.15;
        chargePortLight.intensity = 0;
      }

      if (batterySprite) {
        batterySprite.position.y = 1.72 + Math.sin(elapsed * 2.6) * 0.07;
        const roundedPct = Math.round(STATE.batteryLevel * 100) + (STATE.isCharging ? 1000 : 0);
        if (roundedPct !== lastBatteryRendered) {
          lastBatteryRendered = roundedPct;
          if (batterySprite.material.map) batterySprite.material.map.dispose();
          batterySprite.material.map = createBatteryTexture(STATE.batteryLevel, STATE.isCharging);
        }
      }

      updateParticles(dt, elapsed);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      CAM_CTRL.targetRadius = fitRadius();
    });

    // ============================================================================
    // 12. INITIALIZE SCENE
    // ============================================================================
    buildEnvironment();
    buildCandyHouse();
    buildElectricCarAndCharger();
    initParticlePool();
    setupControlsAndInteractions();
    animate();
  </script>
</body>
</html>
