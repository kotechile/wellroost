# WellRoost edge config (served by nginx:stable-alpine in the production stage of the Dockerfile).
#
# Crawl contract enforced here:
#   1. Unknown URLs answer 404 with a real 404 status and the Astro 404 page — never the homepage
#      with a 200. `try_files … /index.html` is a soft-404 factory and gets pages dropped from
#      Google and Bing indexes.
#   2. /tools/* legacy URLs answer 301 (edge redirect, not a meta-refresh HTML shim).
#   3. Directory routes canonicalise to their trailing-slash form, so each page has exactly one
#      crawlable URL — the one in the sitemap and in <link rel="canonical">.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # --- 1. Legacy /tools/* URLs → real 301s ------------------------------------------------
    # These pages were renamed to /calculators/*. Serve a redirect status so crawlers consolidate
    # the old URLs instead of indexing a noindex meta-refresh page.
    location = /tools/                             { return 301 /calculators/; }
    location = /tools/move-or-improve-calculator/  { return 301 /calculators/move-or-improve/; }
    location = /tools/remodeling-roi-calculator/   { return 301 /calculators/remodeling-roi/; }
    location = /tools/remodelytics/                { return 301 /calculators/remodelytics/; }
    # The lease-break calculator was retired; send it to the calculator hub.
    location = /tools/lease-break-calculator/      { return 301 /calculators/; }

    # --- 2. WordPress backend passthrough ---------------------------------------------------
    # Must stay ahead of the regex handlers below: /wp-json/... has no extension and would
    # otherwise be treated as a page route.
    location ~* ^/(wp-content|wp-includes|wp-json|wp-admin|wp-login\.php|wp-cron\.php) {
        proxy_pass https://cms.wellroost.com;
        proxy_set_header Host cms.wellroost.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --- 3. Page routes ----------------------------------------------------------------------
    # Only real files, real directories and real .html files resolve. Everything else is a 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Directory routes without the trailing slash (/about) → /about/ so there is one URL per page.
    # Anything with a dot in the final segment (assets, robots.txt, sitemap.xml) is left alone.
    location ~ ^/([^.?]*[^/])$ {
        try_files $uri @add_trailing_slash;
    }

    location @add_trailing_slash {
        return 301 $uri/;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- 4. Error handling -------------------------------------------------------------------
    # Astro emits dist/404.html. `internal` keeps it out of direct requests while preserving the
    # 404 status on the response.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# --- 5. www → apex ---------------------------------------------------------------------------
# www.wellroost.com already CNAMEs to this host, so the only thing between it and a duplicate
# copy of the site is routing. This answers 301 whenever the edge forwards www traffic here.
# It is inert until www.wellroost.com is added as a domain on the app (which also issues its
# certificate) — the edge answers 404 for unknown hosts before the request reaches nginx.
server {
    listen 80;
    server_name www.wellroost.com;
    return 301 https://wellroost.com$request_uri;
}
